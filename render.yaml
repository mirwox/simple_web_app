services:
  - type: web
    name: llm-top-trumps
    runtime: python
    plan: free
    buildCommand: |
      pip install -r server/requirements.txt
      cd client && npm install && npm run build
    startCommand: gunicorn --chdir server "app:create_app('production')"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-trumps-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: llm-trumps-db
    plan: free
